aid: aipuqiang
name: Aipuqiang
description: >-
  Aipuqiang is the transliterated name of Shanghai APACTRON Particle Equipment Co., Ltd.
  (上海艾普强粒子设备有限公司), a Shanghai-based manufacturer of proton therapy systems for cancer
  treatment. Founded in June 2011 and controlled by Shanghai Alliance Investment Co., Ltd.
  under the Shanghai SASAC, the company was the industrialization partner for China's first
  domestically developed proton therapy demonstration facility, which received NMPA innovative
  medical device registration in September 2022 and entered clinical service at the Tumor
  Proton Center of Ruijin Hospital in November 2023. Its product line covers the accelerator
  system (injector, synchrotron and high-energy beam transport) together with 180-degree and
  360-degree rotating-gantry and horizontal fixed-beam treatment rooms. Aipuqiang is a capital
  medical-equipment manufacturer: it sells installed proton therapy systems to hospitals and
  publishes no public API, developer portal, SDK or machine-readable specification.
